<script>
/* Soul Sip production Web runtime: the MEMFS feature-pack fetch route.
   See tools/phone_test/inject_web_runtime.py. No diagnostics in this block. */
(function(){
  var configuredAssetBase = "https://cdn.thesecretsofsilverclouds.co.uk/soulsip/20260909";
  window.__soulSipAssetBase = String(configuredAssetBase || "").trim().replace(/\/+$/, "");
  window.__soulSipResolveAsset = function(path){
    var value = String(path || "");
    var base = window.__soulSipAssetBase;
    if (!base) return new URL(value, document.baseURI).href;
    return new URL(value.replace(/^\/+/, ""), base + "/").href;
  };
  /* ---- B2 spike: fetch a feature pack straight into MEMFS ---------------
     The production path is HTTPRequest(download_file) -> `user://` -> IDBFS ->
     IndexedDB. The iPad died inside that await on 2026-08-09 with the whole
     53.1 MB body already delivered, so the cost being paid is the filesystem
     and persistence half, not the network.

     This writes to a NON-persistent MEMFS path instead, with `canOwn: true` so
     MEMFS adopts the fetched bytes rather than `slice()`-ing a second copy —
     the same trick that took the core PCK's boot peak from 661.8 to 330.9 MB.
     No IndexedDB write happens at all.

     Promises cannot be awaited from `JavaScriptBridge.eval`, which is
     synchronous, so progress lands in a status object the caller polls. */
  var fsFetch = {state: "idle", path: "", bytes: 0, ms: 0, error: "", zero_copy: false};
  window.__soulSipFsFetchStatus = function(){ return fsFetch; };
  window.__soulSipFetchToFS = function(url, path){
    fsFetch = {state: "fetching", path: path, bytes: 0, ms: 0, error: "", zero_copy: false};
    var started = performance.now();
    try {
      var FS = window.__soulSipFS;
      if (!FS) { fsFetch.state = "error"; fsFetch.error = "FS not exposed"; return false; }
      fetch(url).then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.arrayBuffer();
      }).then(function(buf){
        var view = new Uint8Array(buf);
        var dir = path.slice(0, path.lastIndexOf("/"));
        if (dir) { try { FS.mkdirTree(dir); } catch (e) {} }
        try { FS.unlink(path); } catch (e) {}
        /* canOwn adopts `view` instead of copying it. Nothing else retains the
           buffer once this returns, so adoption is safe. */
        FS.writeFile(path, view, {canOwn: true});
        fsFetch.zero_copy = true;
        fsFetch.bytes = view.byteLength;
        fsFetch.ms = Math.round(performance.now() - started);
        fsFetch.state = "done";
      }).catch(function(e){
        fsFetch.state = "error";
        fsFetch.error = String((e && e.message) || e).slice(0, 180);
        fsFetch.ms = Math.round(performance.now() - started);
      });
      return true;
    } catch (e) {
      fsFetch.state = "error";
      fsFetch.error = String((e && e.message) || e).slice(0, 180);
      return false;
    }
  };
})();
</script>

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":329474464,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
if (window.__soulSipAssetBase) {
	GODOT_CONFIG.executable = window.__soulSipResolveAsset('index');
	GODOT_CONFIG.mainPack = window.__soulSipResolveAsset('index.pck');
}
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (window.location.protocol === 'file:') {
		displayFailureNotice(new Error('Soul Sip cannot run from a file:// URL. Double-click PLAY_SOUL_SIP_LOCAL.bat instead, or upload this folder to a web host.'));
	} else if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

(function(){
  var LORE = ["Soul Sips taste like pure emotion. Getting the ingredients right is only half the job — the patron still has to feel understood.", "The Sanctuary in the Sky began as a holy refuge. Somewhere along the way, prayer gave way to cocktails. Mostly.", "Every Holy Item carries the remains of a fallen star. Fate forged the fragments into artefacts after the Celestial Shattering.", "Guardians were created alongside the Holy Items. Most people cannot see them — their charge, other Holy Item wielders and sufficiently powerful beings are exceptions.", "Presence can be hidden. The skilled learn to mask their aura; the truly powerful can make a room buckle beneath it.", "Lintels are creatures of contradiction: holy radiation tangled with mortal pollution. They favour places where natural magic still runs strong.", "Seeing many Lintels at once is traditionally considered an omen of change. Whether that is comforting depends rather heavily on the change.", "MI6 officially classifies Nimbus as a hazardous entity. Nimbus can also be distracted with snacks. Bureaucracy has yet to reconcile these facts.", "The Streamliner does not bother going around obstacles. Technomagic lets London's train phase through solid matter instead.", "MI6 and The Order both claim to protect the balance of supernatural power. Agreement on how to do that is another matter entirely.", "A gold-lit card has something to say. Its condition is ready — sometimes the clever move is playing it now, and sometimes it is making the next card even better.", "Order matters behind the bar. A Stir, a Read, an Essence or a discard can change what another card is waiting for. Watch what lights up before you commit."];
  var HINTS = ["A gold rim on a card in hand means its extra effect is live right now. Play it while it is lit.", "Heat plus Chill makes Steam. Heat plus Bitter makes Char. Bitter plus Comfort makes Bittersweet. Two Comforts Mull. Three of the same note Overproofs.", "Tags are optional texture. The guest still wants a feeling and a seasoning. Matching those two is the pour.", "You can serve with no glass. The house pours into a Crystal Shot by default.", "Some guests ask for it Pure. That is a real order, not a missing ingredient. Do not add a seasoning after they say so.", "Stir ends the turn. The guest reacts, one patience face falls, and you get Focus and a card. Cards you have already played stay in the drink.", "You can pull a card back out of the glass until you Stir. After Stir, the turn is committed.", "Patience also drains while you think. Story difficulty stops that clock. Stir still spends a face.", "Double-tap a guest's words to open their full notes. Both clocks pause while you read.", "A second Read costs Focus, never patience. It is the cheapest way to stop guessing the seasoning.", "When you have Read everything they will give, a Known Tell can appear in their notes. It stays with that guest for later nights.", "Overflow past Transformative still pays. Extra points become bonus credits.", "Tonight's Mastery is a live combo, not flavour text. The COMBO row is teaching you a path.", "If a Power card is glowing, it is offering tempo, not just a bigger number.", "Discard is a zone. Some cards pay you for leaving the tray, not only for being played.", "Rush nights snatch. Keep a way to get a card back.", "A Complex Order has two layers. The first Essence you pour is the one on top. The second settles underneath. Both can be right.", "Bar crew perks only apply when they are on the floor. Hiring someone does nothing if they are sat in My Staff.", "Wages come out of the shift ledger at close-out. An empty floor is cheaper. A full floor is kinder.", "Fainted fighters recover in the Soul Ward after completed shifts. Potions shorten the wait. You choose who goes in.", "Held items are assigned on Raid Squad, not from the Satchel during a fight. Check them before you leave the bar.", "Explore keys only open that route's boss gate. A key from one map will not open another.", "Some Explore tiles hide passages the map will not admit are there. Bring a light.", "Presence is travel fuel. Ordinary bar shifts restore it. Do not spend the last of it far from home.", "The Workbench Favour covers one exact missing material, once per shift. Save it for the recipe you actually want.", "At enough Reputation the Card Forge opens on the Workbench. It wants rare materials and a sacrificed battle card.", "Kestrel's best relics are not on the front shelf. Reputation, quests, and Explore unlock them.", "Zara's hunts are not bar cards. Each blood she brings back unlocks a form with a permanent buff.", "Parry is a timing window, not a button mash. A clean parry is worth more than a panicked one.", "In the Lantern Delve, a double-tap raises your guard. Walking and shooting are separate hands.", "Last Orders is a room, not a drink. Clear the floor before the room's patience runs out.", "The Music slider is desktop only. On a phone or iPad, music follows the hardware volume. That is not a bug.", "Soul Sip autosaves, and it keeps the previous valid save. Export a backup before you change browser or device.", "Settings then Help can replay any first-use lesson: hub, deck, shift, battle, parry, Explore. You are never stuck with a one-time explanation.", "A drink that almost matches, served on time, beats a perfect recipe served to an empty stool."];
  var host = document.createElement("div");

  function shuffled(a){
    var c = a.slice();
    for (var i = c.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = c[i]; c[i] = c[j]; c[j] = t;

})();
