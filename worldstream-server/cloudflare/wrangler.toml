name = "silver-clouds-worldstream"
main = "src/worker.mjs"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "WORLD_DO", class_name = "WorldDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldDurableObject"]

[vars]
ENVIRONMENT = "production"
# The world this deployment talks to, and the Durable Object's identity. Two
# values are two separate objects with separate SQLite databases; there is no
# path between them. Local development deliberately keeps the original object
# name so existing local history is not orphaned.
#   local/default  authoritative-world
#   staging        worldstream-staging
#   production     worldstream-production
WORLD_ID = "authoritative-world"
# 4323 is the integrated local dev site (worldstream-server/dev.mjs); 4317 and
# 4322 remain for the workshop server, which can run at the same time.
CORS_ORIGINS = "https://thesecretsofsilverclouds.com,https://www.thesecretsofsilverclouds.com,http://127.0.0.1:4317,http://127.0.0.1:4322,http://127.0.0.1:4323,http://localhost:4323,http://localhost:8787"


# Deploy targets. Each names a different world; neither is deployed yet.
[env.staging]
[env.staging.vars]
ENVIRONMENT = "staging"
WORLD_ID = "worldstream-staging"
CORS_ORIGINS = "https://thesecretsofsilverclouds.com,https://www.thesecretsofsilverclouds.com,http://127.0.0.1:4323,http://localhost:4323"

# Durable Object bindings are NOT inherited by a named environment, and neither
# are migrations. Declared only at the top level they apply to the default
# deploy and silently vanish from `--env production`, which then boots with the
# env vars present, no WORLD_DO, and a 500 on every request that needs the
# world. The deploy output says so if you read the binding list.
[env.staging.durable_objects]
bindings = [
  { name = "WORLD_DO", class_name = "WorldDurableObject" }
]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["WorldDurableObject"]

[env.production]
[env.production.vars]
ENVIRONMENT = "production"
WORLD_ID = "worldstream-production"
CORS_ORIGINS = "https://thesecretsofsilverclouds.com,https://www.thesecretsofsilverclouds.com"

# ---------------------------------------------------------------- the launch
# Thursday 10 September 2026, 17:00 Europe/London. Until this instant the
# Worker answers every route itself and never touches the Durable Object, so
# nothing can start the world early.
LAUNCH_MS = "1789056000000"

# The world's epoch: Thursday 10 September 2026, 00:00 Europe/London.
#
# It has to be a London midnight — `createFixture` refuses anything else, and
# that is what makes a day of history a day rather than an arbitrary span. So a
# 17:00 opening cannot have exactly twenty-four hours behind it. This is the
# nearer of the two available choices: the world will have been running since
# midnight and be seventeen hours old when the doors open, having lived one
# complete morning and afternoon. Midnight on the 9th, the alternative, would
# be forty-one hours and would read as "yesterday and today".
START_MS = "1788994800000"

# 15:55 UTC is 16:55 BST, five minutes before opening. That firing creates the
# world and catches it up; every other firing, this day and every day after,
# returns immediately. Cron expressions are always UTC.
[env.production.triggers]
crons = ["55 15 * * *"]

# Where the world answers. The reader is static and served from the .com; the
# world is a Worker on the .co.uk, and the two are separate origins on purpose —
# that split is the deployed architecture, and running it any other way would
# hide CORS problems until the first deploy. `custom_domain` asks Cloudflare to
# create and route the hostname, so the .co.uk zone must be on this account.
[[env.production.routes]]
pattern = "worldstream-api.thesecretsofsilverclouds.co.uk"
custom_domain = true

# Durable Object bindings are NOT inherited by a named environment, and neither
# are migrations. Declared only at the top level they apply to the default
# deploy and silently vanish from `--env production`, which then boots with the
# env vars present, no WORLD_DO, and a 500 on every request that needs the
# world. The deploy output says so if you read the binding list.
[env.production.durable_objects]
bindings = [
  { name = "WORLD_DO", class_name = "WorldDurableObject" }
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["WorldDurableObject"]
